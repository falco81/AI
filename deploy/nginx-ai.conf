# /etc/nginx/conf.d/ai.conf
#
# The pages of ai, over TLS:  https://ai.example.local/
#
# The page itself is PHP that only relays to the ai daemon on 127.0.0.1:9871,
# run in a php-fpm pool of ai's own. The terminals (/ws/term, a WebSocket) and
# the files (/files/) go to the daemon straight from here, with the session
# cookie - it checks it, and that the request came from this page. Everything
# else is a file (the style, the scripts, the languages) or refused.
#
# Who may reach the pages is the list between AI-ALLOW-BEGIN and AI-ALLOW-END
# (Settings - Firewall and access, or install.sh --allow).

map $args $ai_login_key {
    "~(^|&)api=login(&|$)"   $binary_remote_addr;
    default                  "";
}
limit_req_zone $ai_login_key zone=ai_login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ai_all:10m rate=30r/s;

map $http_upgrade $ai_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name ai.example.local;             # <- your hostname
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name ai.example.local;             # <- your hostname

    root  /var/www/ai;
    index index.php;
    server_tokens off;

    access_log /var/log/nginx/ai-access.log;
    error_log  /var/log/nginx/ai-error.log;

    ssl_certificate           /etc/nginx/certs/ai.pem;
    ssl_certificate_key       /etc/nginx/certs/ai.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:AI:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 8m;
    client_body_timeout  60s;

    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    # php2shell (CVE-2026-109618, CVE-2026-109619): nothing on ai's pages sends
    # a multipart body - files go as the body itself.
    if ($http_content_type ~* "multipart") { return 403; }

    # ---- the page ------------------------------------------------------------
    location = / {
        # AI-ALLOW-BEGIN
        allow 192.168.0.0/16;         # <- who may reach the pages
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # AI-ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        limit_req zone=ai_login burst=10 nodelay;
        limit_req zone=ai_all   burst=80 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/ai.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 600s;
    }
    location = /index.php { return 301 /; }

    # ---- the terminals: a WebSocket to the daemon -----------------------------
    location = /ws/term {
        # AI-ALLOW-BEGIN
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # AI-ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://127.0.0.1:9871;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    # ---- the files: both ways, the file itself the body -----------------------
    location /files/ {
        # AI-ALLOW-BEGIN
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # AI-ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        limit_req zone=ai_all burst=200 nodelay;
        client_max_body_size 64g;
        client_body_timeout  300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:9871;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- does this server answer? -------------------------------------------
    location = /healthz {
        limit_req zone=ai_all burst=10 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/ai.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/healthz.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 10s;
        access_log off;
    }

    # ---- files of the page ---------------------------------------------------
    location /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico { return 301 /assets/favicon.svg; }

    location ~ \.php$ { return 404; }
    location /lang/   { return 404; }
    location ~ /\.    { deny all; }
    location /        { return 404; }
}
