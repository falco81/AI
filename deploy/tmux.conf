# /usr/local/lib/ai/tmux.conf - the tmux servers that hold ai's terminals.
#
# Every terminal of the pages is a tmux session of its own; the browser is
# one more tmux client. Nothing of tmux's own shows (no status line), the
# size follows the window looking at it last, and a program that ends leaves
# its last screen to be read (remain-on-exit) - the pages offer to start it
# again or to close it. -q: an option this tmux does not know yet (AlmaLinux
# 9 has 3.2) is passed over, not an error.
set -gq status off
set -gq history-limit 50000
set -gq mouse on
set -gq escape-time 0
set -gq focus-events on
set -gq set-clipboard on
set -gq allow-rename off
set -gq remain-on-exit on
set -gq window-size latest
set -gq aggressive-resize on
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
set -asq terminal-features ",xterm-256color:RGB:clipboard:extkeys"
set -sq extended-keys on
set -gq allow-passthrough on
set -gq exit-empty off
set -gq destroy-unattached off
set -gq detach-on-destroy on
# A pane that has ended says so in its last line.
set -gq remain-on-exit-format "#[reverse] it ended (#{?pane_dead_status,exit #{pane_dead_status},a signal}) - start it again or close it on the pages #[default]"
